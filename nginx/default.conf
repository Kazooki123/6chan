server {
    listen 80;
    server_name localhost;

    root  /var/www/html;
    index index.php index.html;

    client_max_body_size 35M;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 6chan:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/6chan/php_errors.log";
    }

    location ~* \.(css|js|woff2?|ttf|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(ht|git|env) { deny all; }
    location /config/           { deny all; }
    location /vendor/           { deny all; }
    location /content/          { deny all; }

    error_page 404 /404.php;

    location / {
        try_files \$uri \$uri/ =404;
    }

    # access_log /var/log/6chan/access.log;
    # error_log  /var/log/6chan/error.log;
}