services:
  php:
    build:
      context: .
      dockerfile: Containerfile
    container_name: 6chan

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html

    # userns_mode: keep-id
    security_opt:
      - label=disable

  db:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: 6chan
  
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Note to self: just experimental, prob removed/comment out or kept later on ^_^
  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    cap_add:
      - NET_ADMIN
      - NET_RAW

    network_mode: host

    volumes:
      - ./fail2ban/config:/config
      - /var/log:/var/log:ro
      - ./logs/apache:/remotelogs/apache:ro

    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: buckets
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}

    volumes:
      - minio_data:/data:Z
    command: server /data --console-address ":9001"

  owncast:
    image: owncast/owncast:latest
    ports:
      - "8080:8080"
      - "1935:1935"
    volumes:
      - ./data:/app/data

  mailer:
    image: axllent/mailpit
    container_name: mailer

    ports:
      - "1025:1025"
      - "8025:8025"

    environment:
      MP_DEFAULT_SENDER: "example@example.local"

volumes:
  postgres_data:
  minio_data:
