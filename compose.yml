services:
  php:
    build:
      context: .
      dockerfile: Containerfile
    container_name: 6chan

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html

    # userns_mode: keep-id
    security_opt:
      - label=disable

  db:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: 6chan
  
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      BIND: ":8080"
      DIFFICULTY: "4"
      METRICS_BIND: ":9090"
      SERVE_ROBOTS_TXT: "true"
      TARGET: "http://nginx"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    ports:
      - 8080:8080
    volumes:
      - "./botPolicy.yaml:/data/cfg/botPolicy.yaml:ro"

  nginx:
    image: nginx
    container_name: server
    volumes:
      - "./www:/usr/share/nginx/html"

  # Note to self: just experimental, prob removed/comment out or kept later on ^_^
  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    cap_add:
      - NET_ADMIN
      - NET_RAW

    network_mode: host

    volumes:
      - ./fail2ban/config:/config
      - /var/log:/var/log:ro
      - ./logs/apache:/remotelogs/apache:ro

    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: buckets
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}

    volumes:
      - minio_data:/data:Z
    command: server /data --console-address ":9001"

  # Might still use this in the future, for now the Pion engine
  # written in Go will take the role.
  #
  # owncast:
  #  image: owncast/owncast:latest
  #  container_name: livestream
  #  ports:
  #    - "8080:8080"
  #    - "1935:1935"
  #  volumes:
  #    - ./data:/app/data

  coturn:
    image: docker.io/coturn/coturn
    container_name: coturn
    restart: unless-stoped
    network_mode: "host"
    ports:
      - "3478:3478/udp"
      - "3478:3478"
      - "5349:5349/udp"
      - "5349:5349"
    volumes:
      - "./turnserver.conf:/etc/coturn/turnserver.conf:Z"
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - coturn_data:/var/lib/coturn

  mailer:
    image: axllent/mailpit
    container_name: mailer

    ports:
      - "1025:1025"
      - "8025:8025"

    environment:
      MP_DEFAULT_SENDER: "example@example.local"

volumes:
  postgres_data:
  minio_data:
  coturn_data:
